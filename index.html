<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swadeshi Style Hub – Indian Fashion Brand</title>
  <meta name="description" content="Swadeshi Style Hub – Premium Indian fashion brand. Affordable, stylish & Made in India clothing.">
  <meta name="keywords" content="Swadeshi fashion, Indian clothing, Style Hub, ethnic wear">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{background:#fff;color:#333;}

    header{
      background:#111;color:#fff;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header h1{font-size:20px;}

    nav a{
      color:#fff;
      text-decoration:none;
      margin-left:15px;
      font-size:14px;
    }

    .hero{
      padding:50px 20px;
      text-align:center;
      background:#f5f5f5;
    }
    .hero h2{font-size:28px;margin-bottom:10px;}
    .hero p{font-size:16px;margin-bottom:20px;}
    .btn{
      background:#111;
      color:#fff;
      padding:12px 25px;
      border:none;
      cursor:pointer;
      font-size:15px;
    }

    section{padding:40px 20px;}
    section h2{text-align:center;margin-bottom:30px;}

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:20px;
    }
    .product{
      border:1px solid #ddd;
      padding:15px;
      text-align:center;
    }
    .product img{
      width:100%;
      height:220px;
      object-fit:cover;
    }
    .product h3{margin:10px 0;}
    .product p{font-size:14px;margin-bottom:10px;}

    footer{
      background:#111;
      color:#fff;
      text-align:center;
      padding:20px;
      font-size:14px;
    }

    /* Mobile Bottom Menu */
    .bottom-menu{
      display:none;
    }
    @media(max-width:768px){
      nav{display:none;}
      .bottom-menu{
        display:flex;
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        background:#111;
        justify-content:space-around;
        padding:10px 0;
      }
      .bottom-menu a{
        color:#fff;
        font-size:13px;
        text-decoration:none;
      }
      body{padding-bottom:60px;}
    }
  </style>
</head>

<body>

<header>
  <h1>Swadeshi Style Hub</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<div class="hero" id="home">
  <h2>Premium Swadeshi Fashion</h2>
  <p>Made in India • Affordable • Stylish</p>
  <button class="btn" onclick="goWhatsapp()">Order on WhatsApp</button>
</div>

<!-- PRODUCTS -->
<section id="products">
  <h2>Our Products</h2>
  <div class="products">

    <div class="product">
      <img src="https://via.placeholder.com/300x400" alt="Product">
      <h3>Men T-Shirt</h3>
      <p>Fabric: Polyester</p>
      <p>Price: ₹499</p>
      <button class="btn" onclick="goWhatsapp()">Buy Now</button>
    </div>
